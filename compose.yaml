# Self-hosting (docs/self-hosting.md): put this file next to a `.env` with fresh secrets, then run
# `docker compose up -d`. `curl -fsSL https://saas-monitor.com/install.sh | sh` writes both; in a
# clone, `node scripts/setup.mjs` writes the `.env`. The app listens on port 3000 (APP_PORT).
name: saas-monitor

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saas_monitor
      MYSQL_USER: saas_monitor
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      # Over TCP: the server that initializes the database only listens on its socket.
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 1m

  app:
    # The published image, for amd64 and arm64 (a Raspberry Pi with a 64-bit OS runs it too).
    # `docker compose pull` fetches a newer one; SAAS_MONITOR_VERSION in .env pins a release.
    # compose.build.yaml builds it from source instead.
    image: ghcr.io/synapsr/saas-monitor:${SAAS_MONITOR_VERSION:-latest}
    restart: unless-stopped
    init: true
    ports:
      # Reachable from your network, so a TV or Raspberry Pi can open the screens.
      - "${APP_PORT:-3000}:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: mysql://saas_monitor:${MYSQL_PASSWORD}@db:3306/saas_monitor
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GLEAP_API_KEY: ${GLEAP_API_KEY:-}
      GRADIUM_API_KEY: ${GRADIUM_API_KEY:-}
      GRADIUM_API_URL: ${GRADIUM_API_URL:-https://api.gradium.ai/api}
      MIGRATE_ON_START: ${MIGRATE_ON_START:-true}
      FX_RATES_URL: ${FX_RATES_URL:-https://api.frankfurter.dev/v1}
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  mysql:
