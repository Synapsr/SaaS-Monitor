# Local development services. Start them with `pnpm db:up`.
name: saas-monitor-dev

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: saas_monitor
      MYSQL_USER: saas_monitor
      MYSQL_PASSWORD: saas_monitor
      # Tests connect as root, which creates their database (see src/test/database-url.ts).
      MYSQL_ROOT_PASSWORD: saas_monitor
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      # Over TCP: the server that initializes the database only listens on its socket.
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 2s
      timeout: 5s
      retries: 60

  # Validates Stripe requests against the official OpenAPI spec (no real account needed). Same
  # version as in CI (.github/workflows/ci.yml).
  stripe-mock:
    image: stripe/stripe-mock:v0.205.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STRIPE_MOCK_PORT:-12111}:12111"

volumes:
  mysql:
