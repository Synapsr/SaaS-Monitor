name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: saas_monitor
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      # For the smoke test of the Stripe SDK gateway. Same version as in compose.dev.yaml.
      stripe-mock:
        image: stripe/stripe-mock:v0.205.0
        ports:
          - 12111:12111
    env:
      # As root, which creates the test database (src/test/global-setup.ts).
      TEST_DATABASE_URL: mysql://root:saas_monitor@127.0.0.1:3306/saas_monitor_test
      STRIPE_MOCK_PORT: 12111
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # A schema change committed without its migration makes drizzle-kit generate one here.
      - name: Check that migrations match the schema
        run: |
          pnpm db:generate
          git add --intent-to-add drizzle
          git diff --exit-code drizzle
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
